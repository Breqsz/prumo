<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prumo — Hero · Paleta A: Branco puro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { background: #000; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .font-display { font-family: 'Instrument Serif', serif; }

  /* placeholder do video bg — gradient escuro + sutil radial glow */
  .video-placeholder {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 70%, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 60%),
      radial-gradient(ellipse 50% 40% at 20% 30%, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(180deg, #000 0%, #0a0a0a 60%, #050505 100%);
  }
  /* simulando crop do video translate-y-[17%] com pseudo-overlay */
  .video-vignette::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* LIQUID GLASS — branco translucido */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%,
      rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%,
      rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* linhas verticais — metáfora prumo. paleta A: branco baixo */
  .prumo-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.12) 70%, transparent 100%);
    pointer-events: none;
  }

  /* paleta A: zero cor. acentos sao tudo branco/glass. */
  .accent-text { color: #FFFFFF; }
  .accent-muted { color: rgba(255,255,255,0.55); }
</style>
</head>
<body class="min-h-screen overflow-hidden text-white">
  <div class="relative min-h-screen overflow-hidden bg-black">
    <!-- video placeholder -->
    <div class="absolute inset-0 video-placeholder video-vignette"></div>

    <!-- linhas verticais prumo -->
    <div class="prumo-line" style="left: 16%"></div>
    <div class="prumo-line" style="left: 50%"></div>
    <div class="prumo-line" style="left: 84%"></div>

    <!-- chip indicando paleta -->
    <div class="absolute top-3 left-1/2 -translate-x-1/2 z-30 liquid-glass rounded-full px-3 py-1 text-[10px] tracking-widest uppercase text-white/70">Paleta A · Branco puro</div>

    <!-- NAV -->
    <nav class="relative z-20 pl-6 pr-6 py-6">
      <div class="liquid-glass rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
        <div class="flex items-center gap-8">
          <div class="flex items-center gap-2 font-display text-xl text-white">
            <span aria-hidden class="inline-block w-[2px] h-5 bg-white/80"></span>
            Prumo
          </div>
          <div class="hidden md:flex items-center gap-6 text-sm text-white/70">
            <a class="hover:text-white transition-colors" href="#">Trabalhos</a>
            <a class="hover:text-white transition-colors" href="#">Planos</a>
            <a class="hover:text-white transition-colors" href="#">Sobre</a>
            <a class="hover:text-white transition-colors" href="#">Contato</a>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a class="hidden md:inline-block text-sm text-white/70 hover:text-white transition-colors" href="#">WhatsApp</a>
          <a href="#" class="liquid-glass rounded-full px-5 py-2 text-sm font-medium text-white">Agendar conversa</a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[6%]">
      <p class="text-xs tracking-[0.3em] uppercase text-white/40 mb-8">Estúdio digital · Brasil</p>

      <h1 class="font-display text-5xl md:text-7xl lg:text-[5.5rem] leading-[1.05] tracking-tight mb-8 max-w-5xl">
        Tudo começa por <em class="italic font-display">uma linha reta.</em>
      </h1>

      <p class="text-base md:text-lg text-white/65 max-w-xl mb-10 leading-relaxed">
        Sites, estratégia e presença digital para marcas que valorizam precisão.
      </p>

      <div class="flex flex-col sm:flex-row gap-3 items-center mb-16">
        <a href="#" class="liquid-glass rounded-full px-8 py-3.5 text-sm font-medium text-white flex items-center gap-2 group">
          Agendar conversa
          <i data-lucide="arrow-up-right" class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
        </a>
        <a href="#" class="rounded-full px-8 py-3.5 text-sm font-medium text-white/70 hover:text-white transition-colors">
          Ver trabalhos →
        </a>
      </div>

      <div class="flex items-center gap-6 text-[11px] tracking-widest uppercase text-white/35">
        <span>Next.js</span>
        <span class="w-1 h-1 rounded-full bg-white/30"></span>
        <span>Framer</span>
        <span class="w-1 h-1 rounded-full bg-white/30"></span>
        <span>Webflow</span>
      </div>
    </main>

    <!-- footer social -->
    <div class="relative z-10 flex justify-center gap-3 pb-10">
      <a href="#" aria-label="Instagram" class="liquid-glass rounded-full p-3.5 text-white/70 hover:text-white transition-colors">
        <i data-lucide="instagram" class="w-4 h-4"></i>
      </a>
      <a href="#" aria-label="LinkedIn" class="liquid-glass rounded-full p-3.5 text-white/70 hover:text-white transition-colors">
        <i data-lucide="linkedin" class="w-4 h-4"></i>
      </a>
      <a href="#" aria-label="WhatsApp" class="liquid-glass rounded-full p-3.5 text-white/70 hover:text-white transition-colors">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
      </a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
